[project]
name = "cronsentinel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "alembic>=1.13", "pydantic>=2.8", "pydantic-settings>=2.4", "redis>=5.0", "nats-py>=2.8",
  "croniter>=3.0", "python-ulid>=2.7", "argon2-cffi>=23.1", "python-jose[cryptography]>=3.3",
  "httpx>=0.27", "structlog>=24.4", "cron-descriptor>=1.4",
  "celery[redis]>=5.4", "cryptography>=43", "prometheus-client>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "jsonschema>=4.23"]  # jsonschema: R14 mock/real schema contract
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["cronsentinel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
