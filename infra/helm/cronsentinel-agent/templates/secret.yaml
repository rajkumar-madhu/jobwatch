{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata: {name: {{ include "csa.name" . }}-bootstrap, namespace: {{ .Release.Namespace }}}
{{/* R37: bootstrapToken defaulted to "" with nothing enforcing a real value — `helm install`
     with no override silently created a Secret with an empty token, so the agent's first-run
     enrollment would fail with whatever opaque error the API gives an empty bearer, not a clear
     install-time failure. required() only applies on this branch: existingSecret's whole point
     is bringing your own token, so that path is correctly untouched. */}}
stringData: {token: {{ required "agent.bootstrapToken must be set (or set existingSecret to bring your own)" .Values.bootstrapToken | quote }}}
{{- end }}
