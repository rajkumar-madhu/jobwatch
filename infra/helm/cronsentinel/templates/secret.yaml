apiVersion: v1
kind: Secret
metadata: {name: {{ include "cs.fullname" . }}-env, namespace: {{ .Release.Namespace }}}
stringData: {{ toYaml .Values.env | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cs.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  # R37: was `pre-install,pre-upgrade` UNQUOTED inside this flow map — the comma closed the
  # "helm.sh/hook" entry and opened a bogus null-valued "pre-upgrade" key. Real effect: this
  # secret (and the migrate Job below, same bug) only ever ran on the FIRST install; every
  # `helm upgrade` after that skipped it, so `alembic upgrade head` silently stopped running on
  # every deploy after the first. Found by rendering the chart and parsing the real YAML — never
  # exercised before (`helm template` was never run against this chart until now).
  annotations: {"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-weight": "-5"}
stringData:
  DATABASE_URL: {{ .Values.migration.databaseUrl | quote }}
  JOBWATCH_APP_DB_PASSWORD: {{ .Values.migration.appDbPassword | quote }}
