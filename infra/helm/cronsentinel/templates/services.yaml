{{- range $s := list (dict "n" "api" "p" 8000) (dict "n" "ingest" "p" 8010) (dict "n" "web" "p" 3000) }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "cs.fullname" $ }}-{{ $s.n }}, namespace: {{ $.Release.Namespace }}}
spec: {selector: {app: {{ include "cs.fullname" $ }}-{{ $s.n }}}, ports: [{port: {{ $s.p }}, targetPort: {{ $s.p }}}]}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "50"
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.domain }}
        {{- if and .Values.ingestDomain (ne .Values.ingestDomain .Values.domain) }}
        - {{ .Values.ingestDomain }}
        {{- end }}
      secretName: {{ include "cs.fullname" . }}-tls
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - {path: /api/v1/heartbeat, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-ingest, port: {number: 8010}}}}
          - {path: /ping, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-ingest, port: {number: 8010}}}}
          - {path: /heartbeat, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-ingest, port: {number: 8010}}}}
          - {path: /agent, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-ingest, port: {number: 8010}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-api, port: {number: 8000}}}}
          - {path: /auth, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-api, port: {number: 8000}}}}
          - {path: /public, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-api, port: {number: 8000}}}}
          - {path: /docs, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-api, port: {number: 8000}}}}
          - {path: /openapi.json, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-api, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-web, port: {number: 3000}}}}
    {{- if and .Values.ingestDomain (ne .Values.ingestDomain .Values.domain) }}
    - host: {{ .Values.ingestDomain }}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: {{ include "cs.fullname" . }}-ingest, port: {number: 8010}}}}]}
    {{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "cs.fullname" . }}-ingest, namespace: {{ .Release.Namespace }}}
spec: {scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "cs.fullname" . }}-ingest}, minReplicas: {{ .Values.replicas.ingest }}, maxReplicas: 20, metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]}
