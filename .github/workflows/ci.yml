name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16-alpine, env: {POSTGRES_USER: cronsentinel, POSTGRES_PASSWORD: cronsentinel, POSTGRES_DB: cronsentinel}, ports: ["5432:5432"], options: --health-cmd pg_isready --health-interval 5s --health-retries 10}
      redis: {image: "redis:7-alpine", ports: ["6379:6379"]}
      nats: {image: "nats:2.10-alpine", ports: ["4222:4222"], options: --entrypoint "/nats-server -js"}
    env: {DATABASE_URL: postgresql+psycopg://cronsentinel:cronsentinel@localhost:5432/cronsentinel, JOBWATCH_APP_DB_PASSWORD: app}   # owner URL: migrations only; the test step overrides it with the app role
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # migrations run as the owner and provision the app role; tests run AS the app role so RLS is real
      - run: cd apps/api && pip install -e ".[dev]" && ruff check .
      - run: cd apps/api && JOBWATCH_APP_DB_PASSWORD=app alembic upgrade head
      - run: cd apps/api && alembic downgrade base && JOBWATCH_APP_DB_PASSWORD=app alembic upgrade head   # full chain must be reversible
      - run: cd apps/api && pytest -q
        env:
          DATABASE_URL: "postgresql+psycopg://jobwatch_app:app@localhost:5432/cronsentinel"
          SECRET_ENCRYPTION_KEY: ci-only-not-a-secret
          REDIS_URL: "redis://localhost:6379/0"
          NATS_URL: "nats://localhost:4222"
  # note: R13 mock/real contract tests run in the `api` job (tests/test_mock_contract.py and
  # tests/integration/test_mock_shape_contract.py); they guard the mock the web e2e job depends on.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: cd apps/web && (npm ci --no-audit || npm install)
      # R15: regenerate types from the live spec and fail if the checked-in file is stale, so
      # lib/api-types.ts cannot drift from the API's actual response models.
      - run: pip install -e apps/api
        env: {DATABASE_URL: "postgresql+psycopg://u:p@localhost/db", SECRET_ENCRYPTION_KEY: ci}
      - run: |
          cd apps/api && python -c "import json;from cronsentinel.main import app;json.dump(app.openapi(),open('../web/openapi.json','w'),indent=2)"
        env: {DATABASE_URL: "postgresql+psycopg://u:p@localhost/db", SECRET_ENCRYPTION_KEY: ci}
      - run: cd apps/web && npm run types:gen && git diff --exit-code lib/api-types.ts openapi.json
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && npm test            # vitest: lib/format + lib/api CSRF logic
      - run: cd apps/web && npm run build
      # e2e against the mock API in tools/ui-review — no DB, deterministic fixtures
      - run: pip install fastapi uvicorn
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: |
          cd tools/ui-review && uvicorn mock_api:app --port 8000 &
          cd apps/web && npm start -- -p 3000 &
          npx wait-on http://localhost:8000/api/v1/jobs http://localhost:3000 -t 60000
        working-directory: .
      - run: cd apps/web && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: apps/web/playwright-report, retention-days: 7}
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: cd agents/linux-agent && go vet ./... && go test ./... && make build
      - run: cd agents/k8s-agent && go mod tidy && go vet ./... && go build ./...
  images:
    needs: [api, web, agents]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/Dockerfile.api -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} . && docker build -f infra/docker/Dockerfile.web -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} .
      # TODO: login + push to GHCR, helm package, release assets for agent binaries
